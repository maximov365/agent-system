name: Agent Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  framework-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install framework dependencies
        run: python -m pip install -r requirements-framework.txt
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate templates without writing
        run: python setup.py --check
      - name: Audit local contracts
        run: python audit.py --local --json --fail-on critical
