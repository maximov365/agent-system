name: Agent Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner_os:
        description: Explicit runner for compatibility verification
        type: choice
        default: ubuntu-24.04
        options: [ubuntu-24.04, ubuntu-26.04]
      python_latest:
        description: Explicit latest Python compatibility target
        type: choice
        default: "3.14"
        options: ["3.14", "3.15"]

permissions:
  contents: read

jobs:
  framework-audit:
    runs-on: ${{ inputs.runner_os || 'ubuntu-24.04' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "${{ inputs.python_latest || '3.14' }}"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install framework dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
      - name: Regression tests
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Validate templates without writing
        run: .venv/bin/python setup.py --check
      - name: Audit local contracts
        run: .venv/bin/python audit.py --local --json --fail-on warning
  visual-runner:
    runs-on: ${{ inputs.runner_os || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install optional visual dependencies
        run: npm ci --prefix tools/visual
      - name: Install test browser
        working-directory: tools/visual
        run: npx playwright install --with-deps chromium --only-shell
      - name: Test actual browser evidence and negative cases
        env:
          AGENT_VISUAL_TEST_BROWSER: "1"
        run: node --test tools/visual/test/runner.test.mjs
      - name: Test isolated reference game logic
        run: node --test examples/game-slice/test/model.test.mjs
      - name: Verify UI evaluation grader against broken and repaired fixtures
        env:
          AGENT_VISUAL_TEST_BROWSER: "1"
        run: node --test evals/test_ui_grader.mjs

  dependency-advisories:
    # Explicit release/published-change check; ordinary local audit stays offline.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Audit resolved framework requirements
        run: |
          python -m pip install -r requirements-audit.txt
          python -m pip_audit --strict -r requirements-dev.txt
      - name: Audit locked visual dependencies
        run: npm audit --prefix tools/visual --omit=dev
